# Tiered scenarios show one routine done four ways. Order here is the order on the page.
tier:
  basic: { en: "Copilot Chat (Basic)", description: "No Copilot add-on licence. Copilot works on what you open, attach or ask about in Outlook." }
  premium: { en: "Microsoft 365 Copilot (Premium)", description: "Add-on licence. Grounded in your mail, chats, meetings and files; scheduled prompts." }
  cowork: { en: "Copilot Cowork", description: "Premium plus Copilot credits. Runs multi-step tasks on a schedule or when an email arrives; asks before it sends." }
  scout: { en: "Microsoft Scout", description: "Desktop agent that runs your automations on a schedule and reports back in Teams." }

market:
  ID: { en: "Indonesia" }
  MY: { en: "Malaysia" }

difficulty:
  "1": { en: "L1 Starter", description: "One prompt against one source; skim the output." }
  "2": { en: "L2 Practitioner", description: "Iterate over several turns with your own files, or run a ready-made Scout automation or Cowork task." }
  "3": { en: "L3 Power user", description: "Chain apps, batch inputs, verify systematically, write your own Scout automation." }
  "4": { en: "L4 Builder", description: "Publish an agent with grounding and instructions for other people to use." }

evidence:
  estimated: { en: "Estimated" }
  observed-in-pilot: { en: "Observed in pilot" }
  customer-measured: { en: "Customer measured" }

# Has someone actually run every step? Draft scenarios have not been run end to end yet.
status:
  draft: { en: "Draft", description: "Written from product knowledge; not yet run end to end." }
  partly-validated: { en: "Partly validated", description: "Core steps run end to end; some steps (see note) not yet exercised." }
  validated: { en: "Validated", description: "Every step run end to end in a demo tenant." }

