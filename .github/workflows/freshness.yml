name: Freshness check

on:
  schedule:
    - cron: "0 1 * * 1" # Mondays 08:00 WIB / 09:00 MYT
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Open one revalidation issue per stale scenario
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create freshness --color FBCA04 --description "Scenario needs revalidation" 2>/dev/null || true
          node scripts/freshness.mjs > stale.json
          jq -c '.[]' stale.json | while read -r s; do
            id=$(jq -r .id <<<"$s"); title=$(jq -r .title <<<"$s"); v=$(jq -r .validated_on <<<"$s"); age=$(jq -r .age_days <<<"$s")
            issue="Revalidate: $id"
            if gh issue list --label freshness --state open --search "\"$issue\" in:title" --json number -q '.[0].number' | grep -q .; then
              echo "open issue exists for $id"; continue
            fi
            gh issue create --label freshness --title "$issue" --body "**$title** was last validated on $v ($age days ago).

          - [ ] Run every step in the demo tenant
          - [ ] Update prompts, limits and screenshots if the product changed
          - [ ] Set \`validated_on\` to today
          - [ ] Upgrade the evidence badge if you have observed timings"
          done
