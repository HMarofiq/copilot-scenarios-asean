name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for gitleaks

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Required sections
        run: node scripts/check-sections.mjs

      - name: Approved images only
        run: node scripts/check-images.mjs

      - name: Banned terms (public patterns + private customer list)
        # Secrets are not passed to pull requests from forks. Those PRs fail this step
        # and must be re-checked by a maintainer before merge.
        env:
          BANNED_TERMS: ${{ secrets.BANNED_TERMS }}
        run: node scripts/check-banned-terms.mjs

      - name: Build (schema validation + Markdown render + search index)
        run: npm run build

      - name: Source links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --max-retries 2 --accept 200,429 "content/scenarios/*.md"
          fail: true

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
